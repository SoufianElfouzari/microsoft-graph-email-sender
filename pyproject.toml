[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-graph-email-sender"
version = "0.1.0"
description = "Python service for sending emails via Microsoft Graph API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Soufian Elfouzari" }
]

keywords = [
    "microsoft-graph",
    "email",
    "python",
    "msal",
    "microsoft-365"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "msal>=1.33.0,<2.0.0",
    "requests>=2.32.4,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[project.urls]
Homepage = "https://github.com/SoufianElfouzari/microsoft-graph-email-sender"
Repository = "https://github.com/SoufianElfouzari/microsoft-graph-email-sender"
Issues = "https://github.com/SoufianElfouzari/microsoft-graph-email-sender/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true